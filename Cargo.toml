[workspace]
members = [
    "apps/jarvis-cli",
    "apps/jarvisd",
    "crates/jarvis-application",
    "crates/jarvis-domain",
    "crates/jarvis-infrastructure",
    "crates/jarvis-observability",
    "crates/jarvis-protocol",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98.1"
publish = false

[workspace.dependencies]
jarvis-application = { path = "crates/jarvis-application" }
jarvis-domain = { path = "crates/jarvis-domain" }
jarvis-infrastructure = { path = "crates/jarvis-infrastructure" }
jarvis-observability = { path = "crates/jarvis-observability" }
jarvis-protocol = { path = "crates/jarvis-protocol" }

jiff = { version = "0.2.37", default-features = false, features = ["std", "serde"] }
axum = { version = "0.8.9", default-features = false, features = ["http1", "json", "tokio"] }
futures-core = { version = "0.3.34", default-features = false }
clap = { version = "4.6.7", features = ["derive"] }
directories = { version = "6.0.0" }
getrandom = { version = "0.4.1" }
http-body-util = { version = "0.1.3" }
ed25519-dalek = { version = "=3.0.0", default-features = false, features = ["zeroize"] }
log = { version = "0.4.34" }
sha2 = { version = "0.10.9" }
subtle = { version = "2.6.1" }
tower = { version = "0.5.3", features = ["util"] }
tower-http = { version = "0.7.1", features = ["limit"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.151" }
sqlx = { version = "0.9.0", default-features = false, features = [
    "runtime-tokio",
    "sqlite-bundled",
    "migrate",
    "macros",
    "uuid",
] }
thiserror = { version = "2.0.20" }
toml = { version = "1.1.6", features = ["parse", "serde", "display"] }

# The Model Context Protocol SDK. Pinned exactly, and **stdio only**: the Streamable HTTP transport
# is deliberately not enabled because it would add a TLS stack this workspace does not otherwise
# have (an inspection of `Cargo.lock` finds no `rustls`, `native-tls`, `openssl`, or `ring`). The
# `server` feature is off because JARVIS is an MCP client here. See
# `docs/research/integrations/mcp.md`, and `rmcp` is intentionally absent from `jarvis-domain`.
rmcp = { version = "=3.5.0", default-features = false, features = [
    "client",
    "transport-io",
    "transport-child-process",
] }

# TLS for cloud model endpoints. Pinned exactly; `rustls` must stay >= 0.23.45 (RUSTSEC-2026-0285).
# `aws_lc_rs` is rustls's own default provider; `ring` is not enabled. Trust roots are the compiled-in
# Mozilla set (`webpki-roots`), so there is no OS trust-store dependency. See
# `docs/research/integrations/openai-compatible-model.md`, "TLS transport".
rustls = { version = "=0.23.45", default-features = false, features = ["std", "tls12", "aws_lc_rs"] }
tokio-rustls = { version = "=0.26.6", default-features = false, features = ["tls12", "aws_lc_rs"] }
webpki-roots = { version = "=1.0.9" }
rcgen = { version = "=0.14.10", default-features = false, features = ["pem", "aws_lc_rs"] }

tokio = { version = "1.53.1", default-features = false, features = [
    "fs",
    "io-util",
    "macros",
    "net",
    "process",
    "rt-multi-thread",
    "signal",
    "sync",
    "time",
] }
tokio-util = { version = "0.7.19", default-features = false, features = ["rt"] }
tracing = { version = "0.1.44", features = ["attributes"] }
tracing-appender = { version = "=0.2.4" }
tracing-subscriber = { version = "0.3.23", features = [
    "env-filter",
    "fmt",
    "json",
    "registry",
] }
uuid = { version = "1.26.1", features = ["serde", "v7"] }

[workspace.lints.rust]
future-incompatible = { level = "deny", priority = -1 }
rust-2018-idioms = { level = "deny", priority = -1 }
unsafe-code = "deny"
unused-lifetimes = "deny"
unused-qualifications = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
dbg-macro = "deny"
expect-used = "deny"
module-name-repetitions = "allow"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unwrap-used = "deny"