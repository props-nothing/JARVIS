name: CI

# Baseline engineering gates. These run on the host target only: they prove the
# workspace formats, lints, tests, and keeps its documentation and evidence
# manifest consistent. Native per-target proof lives in `native.yml`.
#
# No secret is referenced by this workflow, and no signing or publishing step
# exists here. Production signing and promotion are owner-controlled (`OWN-003`,
# `OWN-004`).

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

# Deny every permission the workflow does not use, then grant only read. A
# dependency install or test run has no legitimate reason to write to the
# repository, packages, or releases.
permissions:
  contents: read

# A newer push supersedes an in-flight run for the same ref, but a run on the
# default branch is never cancelled by a branch push.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != format('refs/heads/{0}', github.event.repository.default_branch) }}

env:
  CARGO_TERM_COLOR: always
  # Warnings are already denied by the workspace lint configuration; this keeps
  # third-party build scripts from silently succeeding on a deprecation.
  RUSTFLAGS: -D warnings

jobs:
  docs:
    name: docs and evidence gates
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      # The validator is the repository's own contract checker. Its test suite
      # must pass first, so a weakened validator cannot be used to pass the gate.
      - name: Validate the validator
        run: node --test scripts/validate-docs.test.mjs

      - name: Validate documentation, requirements, TODO IDs, and evidence
        run: node scripts/validate-docs.mjs

  lint:
    name: format and lints
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # The toolchain version is pinned by `rust-toolchain.toml`, so the action
      # installs exactly that version rather than a moving default.
      - name: Install the pinned toolchain
        run: rustup show active-toolchain || rustup toolchain install

      - name: Cache the Cargo registry and build outputs
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-lint-${{ hashFiles('**/Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: ${{ runner.os }}-lint-

      - name: Check formatting
        run: cargo fmt --all --check

      # `-D warnings` is passed explicitly as well as being set in
      # `Cargo.toml`, so a workspace lint regression cannot quietly pass.
      - name: Run Clippy with warnings denied
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  test:
    name: workspace tests
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install the pinned toolchain
        run: rustup show active-toolchain || rustup toolchain install

      - name: Cache the Cargo registry and build outputs
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-test-${{ hashFiles('**/Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: ${{ runner.os }}-test-

      # `--test-threads=1` is not used: tests must be independent enough to run
      # in parallel, and a shared-profile surprise is a defect worth failing on.
      - name: Run the workspace test suite
        run: cargo test --workspace --all-features
